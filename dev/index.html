<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luxury Cards Dev</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(1200px 600px at 50% -10%, rgba(200,164,106,.07), transparent 60%), #0A0908;
    color: #EEE9E1;
    font-family: "Manrope", -apple-system, sans-serif;
  }
  header { max-width: 1180px; margin: 0 auto; padding: 48px 24px 24px; }
  header p { margin: 0 0 10px; font-size: 11px; letter-spacing: .28em; text-transform: uppercase; color: #C8A46A; }
  h1 { margin: 0; font-weight: 200; font-size: 36px; }
  main {
    max-width: 1180px; margin: 0 auto; padding: 0 24px 80px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; align-items: start;
  }
  .stack { display: grid; gap: 20px; }
  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: #1C1B18; border: 1px solid rgba(255,240,220,.13); border-radius: 99px;
    padding: 10px 18px; font-size: 13px; opacity: 0; transition: opacity .3s;
  }
  #editor { max-width: 1180px; margin: 0 auto; padding: 0 24px 80px; }
  #editor h2 { font-weight: 200; font-size: 28px; margin: 0 0 16px; }
  #editor select { background: #1C1B18; color: #EEE9E1; border: 1px solid #333; border-radius: 8px; padding: 8px; margin-bottom: 16px; }
  .editor-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; align-items: start; }
  #editor-form { background: #141311; border: 1px solid rgba(255,240,220,.07); border-radius: 16px; padding: 16px; }
  #editor-yaml { margin: 0; background: #141311; border: 1px solid rgba(255,240,220,.07); border-radius: 16px; padding: 16px; font-size: 12px; color: #C8A46A; overflow: auto; }
  @media (max-width: 420px) {
    header { padding: 32px 16px 16px; }
    main { padding: 0 16px 60px; grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <p>Ambiente di sviluppo · hass simulato</p>
  <h1>Luxury Cards</h1>
</header>
<main id="cards"></main>
<section id="editor">
  <h2>Editor grafico</h2>
  <select id="editor-type"></select>
  <div class="editor-grid">
    <div id="editor-form"></div>
    <pre id="editor-yaml"></pre>
    <div id="editor-preview"></div>
  </div>
</section>
<div id="toast"></div>

<script type="module">
  import "../src/index.ts";
  import { connect } from "./mock-hass.ts";
  import "./mock-ha-form.ts";

  // Same configs a user would write in YAML
  const layout = [
    [
      { type: "luxury-thermostat-mini-card", entity: "climate.soggiorno", room: "Soggiorno" },
      { type: "luxury-button-card", name: "Apri tutto", room: "Tapparelle", icon: "blinds_open",
        tap_action: { action: "perform-action", perform_action: "cover.open_cover", target: { entity_id: ["cover.camera"] } } },
      { type: "luxury-button-card", name: "Spegni tutte le luci", icon: "power", secondary: "Tutta la casa",
        tap_action: { action: "perform-action", perform_action: "light.turn_off", target: { entity_id: ["light.lampadario", "light.piantana", "light.strip_led", "light.comodino", "light.lampada_studio"] }, confirmation: { text: "Spegnere tutte le luci?" } } },
      { type: "luxury-button-card", name: "Chiudi", icon: "blinds_closed", layout: "tile",
        tap_action: { action: "perform-action", perform_action: "cover.close_cover", target: { entity_id: "cover.camera" } } },
    ],
    { type: "luxury-thermostat-card", entity: "climate.soggiorno", room: "Soggiorno" },
    { type: "luxury-energy-card", room: "Casa", entities: {
      home: "sensor.home_power",
      solar: "sensor.solar_power",
      battery: "sensor.battery_power",
      battery_soc: "sensor.battery_soc",
      consumption_today: "sensor.energy_today",
      production_today: "sensor.solar_energy_today",
      grid_import_today: "sensor.grid_import_today",
    } },
    { type: "luxury-cover-card", entity: "cover.camera", room: "Camera" },
    { type: "luxury-light-group-card", title: "Soggiorno", entities: [
      { entity: "light.lampadario", icon: "chandelier" },
      { entity: "light.piantana", icon: "floor" },
      { entity: "light.strip_led", icon: "strip" },
      { entity: "light.applique", icon: "bulb" },
    ] },
    { type: "luxury-dimmer-card", entity: "light.lampada_studio", room: "Studio" },
    [
      { type: "luxury-light-card", entity: "light.plafoniera", room: "Ingresso", icon: "ceiling" },
      { type: "luxury-light-card", entity: "light.comodino", room: "Camera", icon: "table" },
      { type: "luxury-light-card", entity: "switch.presa_lampada", room: "Studio", icon: "floor" },
      { type: "luxury-light-card", entity: "light.giardino", room: "Esterno", icon: "spot" },
    ],
    // Compact variants
    [
      { type: "luxury-light-group-card", title: "Cucina · compatta", compact: true, entities: [
        { entity: "light.lampadario", icon: "chandelier" },
        { entity: "light.piantana", icon: "floor" },
        { entity: "light.strip_led", icon: "strip" },
        { entity: "light.applique", icon: "bulb" },
      ] },
      { type: "luxury-dimmer-card", entity: "light.lampada_studio", room: "Studio", compact: true },
      { type: "luxury-light-card", entity: "light.comodino", icon: "table", compact: true },
      { type: "luxury-cover-card", entity: "cover.camera", compact: true },
    ],
    [
      { type: "luxury-thermostat-card", entity: "climate.soggiorno", room: "Soggiorno", compact: true },
      { type: "luxury-energy-card", room: "Casa", compact: true, entities: {
        home: "sensor.home_power", solar: "sensor.solar_power", battery: "sensor.battery_power", battery_soc: "sensor.battery_soc",
      } },
    ],
  ];

  const root = document.getElementById("cards");
  const cards = [];
  const make = (config) => {
    const el = document.createElement(config.type);
    el.setConfig(config);
    cards.push(el);
    return el;
  };
  for (const item of layout) {
    if (Array.isArray(item)) {
      const stack = document.createElement("div");
      stack.className = "stack";
      item.forEach((c) => stack.appendChild(make(c)));
      root.appendChild(stack);
    } else {
      root.appendChild(make(item));
    }
  }

  connect((hass) => cards.forEach((c) => (c.hass = hass)));

  // Editor playground: pick a card, edit it with its visual editor, see YAML and preview
  const types = ["luxury-button-card", "luxury-thermostat-mini-card", "luxury-light-group-card", "luxury-light-card", "luxury-dimmer-card",
    "luxury-thermostat-card", "luxury-cover-card", "luxury-energy-card"];
  const picker = document.getElementById("editor-type");
  picker.innerHTML = types.map((t) => `<option>${t}</option>`).join("");
  let hassNow;
  connect((h) => { hassNow = h; const p = document.querySelector("#editor-preview > *"); if (p) p.hass = h; });
  const showEditor = async (tag) => {
    const cls = customElements.get(tag);
    const start = layout.flat().find((c) => c.type === tag) ?? { type: tag, ...cls.getStubConfig() };
    const editor = await cls.getConfigElement();
    editor.hass = hassNow;
    const host = document.getElementById("editor-form");
    host.replaceChildren(editor);
    const render = (config) => {
      document.getElementById("editor-yaml").textContent = JSON.stringify(config, null, 2);
      const card = document.createElement(tag);
      try { card.setConfig(config); card.hass = hassNow; document.getElementById("editor-preview").replaceChildren(card); }
      catch (err) { document.getElementById("editor-preview").textContent = err.message; }
    };
    editor.setConfig(start);
    render(start);
    editor.addEventListener("config-changed", (e) => { editor.setConfig(e.detail.config); render(e.detail.config); });
  };
  picker.onchange = () => showEditor(picker.value);
  showEditor(types[0]);

  // What Home Assistant does with `hass-action`: run the configured action
  window.addEventListener("hass-action", (e) => {
    const { config, action } = e.detail;
    const a = config[`${action}_action`];
    if (!a || a.action !== "perform-action") return;
    if (a.confirmation && !confirm(a.confirmation.text ?? "Confermi?")) return;
    const [domain, service] = a.perform_action.split(".");
    hassNow.callService(domain, service, { ...(a.data ?? {}), ...(a.target ?? {}) });
  });

  const toast = document.getElementById("toast");
  window.addEventListener("hass-more-info", (e) => {
    toast.textContent = `more-info: ${e.detail.entityId}`;
    toast.style.opacity = 1;
    setTimeout(() => (toast.style.opacity = 0), 1500);
  });
</script>
</body>
</html>
